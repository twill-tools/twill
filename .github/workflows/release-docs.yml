name: Release twill documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv with Python 3.14
      uses: astral-sh/setup-uv@v10
      with:
        python-version: '3.14'
    - name: Create docs with Sphinx
      run: uv run --only-group docs sphinx-build -b html -nEW docs docs/_build/html
    - name: Upload docs as Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy docs to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
