name: Test twill package using tox

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10
    - name: Install test runner
      run: uv tool install --python 3.14 tox --with tox-uv
    - name: Run twill tests with Python ${{ matrix.python }}
      env:
        PY: ${{ matrix.python }}
      run: tox -e "py${PY/./}"
    - name: Run software quality checks
      if: matrix.python == '3.14'
      run: tox -e ruff,mypy,docs,manifest
