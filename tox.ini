[tox]
envlist = py3{10,11,12,13,14}, ruff, mypy, docs, manifest

[testenv:ruff]
basepython = python3.14
deps = ruff >=0.17, <0.18
commands =
    ruff check src/twill tests extras
    ruff format --check src/twill tests extras

[testenv:mypy]
basepython = python3.14
deps =
    mypy >=2.4, <2.5
    dnspython >=2.7, <3
    types-lxml
    types-setuptools
commands =
    mypy src/twill tests extras

[testenv:docs]
basepython = python3.14
extras =
    docs
commands =
    sphinx-build -b html -nEW docs docs/_build/html

[testenv:manifest]
basepython = python3.14
deps = check-manifest>=0.51,<1
commands =
    check-manifest -v

[testenv]
extras =
    tests
commands =
    pytest tests {posargs}
